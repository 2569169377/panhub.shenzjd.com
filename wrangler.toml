name = "panhub-shenzjd-com"
main = ".output/server/index.mjs"
compatibility_date = "2025-07-15"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".output/public"
binding = "ASSETS"

# 热搜数据存储（D1HotSearchStore 通过 process.env.DB 读取）
[[d1_databases]]
binding = "DB"
database_name = "panhub-hot-searches"
database_id = "b767a695-5d2a-42c1-bf4e-95324af18246"

# 环境变量（与线上 Docker 保持一致；D1_* 为 Docker REST 专用，Worker 无需设置）
[vars]
LOG_LEVEL = "info"