version: '3.8'

services:
  panhub:
    build: .
    container_name: panhub
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      # 持久化热搜 JSON 数据
      - ./data:/app/data
      # 如果需要持久化日志（可选）
      # - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=4000
      - HOST=0.0.0.0
      # 可选：设置日志级别
      - LOG_LEVEL=info
      # 限流可信代理开关：生产域名经 Cloudflare 代理（橙云），CF 注入的
      # CF-Connecting-IP 不可伪造，必须开启才能按真实客户端 IP 限流
      # （否则限流会按 CF 边缘节点 IP 聚合，误伤同地区所有用户）。
      - TRUST_PROXY=1
    # 健康检查
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
